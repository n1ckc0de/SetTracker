        required: true
        schema:
          type: string
          format: uuid
      - name: workoutId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoachApplyPreviewResponse"
