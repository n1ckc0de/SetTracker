openapi: 3.1.0
info:
  title: GymSync API
  description: Gym workout-tracking backend with real-time sync and webhook check-ins.
  contact:
    name: GymSync
    email: dev@example.com
  license:
    name: MIT
  version: 0.1.0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: AI Coach
  description: "Bounds-checked training recommendations. The coach never modifies\
    \ workouts directly — users must accept, modify, or dismiss proposals."
- name: Programs
  description: User-owned training program builder
- name: Statistics
  description: Personal records and progressive-overload recommendations
- name: Statistics
  description: Weekly training volume and progress summaries
- name: Strength
  description: Deterministic strength calculations
- name: Workout Sets
  description: "Logging, editing, and removing sets within a workout"
- name: Readiness
  description: Pre-workout readiness check-ins
- name: Auth
  description: Registration and login
- name: Exercises
  description: Global and user-owned exercise catalog
- name: Workouts
  description: "Workout sessions: start, list/filter, complete, cancel"
- name: Exercise media suggestions
  description: Auto-suggested media pending human review before publishing onto an
    exercise
- name: Notes Import
  description: AI-assisted import of free-text workout notes
paths:
  /api/workouts/{workoutId}/exercises/{exerciseId}/note:
    put:
      tags:
      - Workout Sets
      summary: Create or update an exercise-level note for a workout
      operationId: upsertExerciseNote
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertWorkoutExerciseNoteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutExerciseNoteResponse"
  /api/sets/{setId}:
    put:
      tags:
      - Workout Sets
      summary: Update a logged set
      operationId: updateSet
      parameters:
      - name: setId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkoutSetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutSetResponse"
    delete:
      tags:
      - Workout Sets
      summary: Delete a logged set
      operationId: deleteSet
      parameters:
      - name: setId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/programs/{programId}:
    get:
      tags:
      - Programs
      summary: Get a program with days and planned exercises
      operationId: get
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProgramDetailResponse"
    put:
      tags:
      - Programs
      summary: Update program name/description
      operationId: update
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProgramSummaryResponse"
    delete:
      tags:
      - Programs
      summary: Hard-delete a program and its days (planning data only)
      operationId: delete
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/programs/{programId}/days/{dayNumber}:
    put:
      tags:
      - Programs
      summary: Replace a day's name and planned exercises
      operationId: updateDay
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dayNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramDayRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProgramDayResponse"
    delete:
      tags:
      - Programs
      summary: Delete a program day
      operationId: deleteDay
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dayNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: No Content
  /api/exercises/{exerciseId}:
    get:
      tags:
      - Exercises
      summary: "Get a single exercise (global, or owned by the current user)"
      operationId: getExercise
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExerciseResponse"
    put:
      tags:
      - Exercises
      summary: Update a custom exercise owned by the current user
      operationId: updateExercise
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExerciseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExerciseResponse"
    delete:
      tags:
      - Exercises
      summary: Delete a custom exercise owned by the current user
      operationId: deleteExercise
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/workouts:
    get:
      tags:
      - Workouts
      summary: "List the current user's workout history, newest first by default"
      operationId: listWorkouts
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CANCELLED
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - MANUAL
          - WEBHOOK
          - NOTES_IMPORT
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseWorkoutResponse"
    post:
      tags:
      - Workouts
      summary: "Start a new manual, active workout (one active workout per user)"
      operationId: startWorkout
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutResponse"
  /api/workouts/{workoutId}/sets:
    get:
      tags:
      - Workout Sets
      summary: List the sets logged for a workout
      operationId: listSets
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSetResponse"
    post:
      tags:
      - Workout Sets
      summary: Log a set on an active workout or a pending-review import
      operationId: addSet
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutSetRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutSetResponse"
  /api/workouts/{workoutId}/sets/batch:
    post:
      tags:
      - Workout Sets
      summary: Log multiple sets with shared values at once
      operationId: addBatchSets
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchWorkoutSetsRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSetResponse"
  /api/webhooks/checkin:
    post:
      tags:
      - Webhooks
      summary: Gym check-in webhook (HMAC signed)
      operationId: checkIn
      parameters:
      - name: X-Webhook-Timestamp
        in: header
        required: false
        schema:
          type: string
      - name: X-Webhook-Signature
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CheckInWebhookResponse"
  /api/strength/estimate-1rm:
    post:
      tags:
      - Strength
      summary: Estimate 1RM from weight and reps using Epley and Brzycki formulas
      operationId: estimate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Estimate1RmRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Estimate1RmResponse"
  /api/readiness:
    get:
      tags:
      - Readiness
      summary: List readiness check-ins in a date range (defaults to last 30 days)
      operationId: list
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadinessResponse"
    post:
      tags:
      - Readiness
      summary: Create a readiness check-in (all fields optional)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadinessRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/programs:
    get:
      tags:
      - Programs
      summary: List programs owned by the current user
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummaryResponse"
    post:
      tags:
      - Programs
      summary: Create a program
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProgramSummaryResponse"
  /api/programs/{programId}/days:
    post:
      tags:
      - Programs
      summary: Add a day with planned exercises
      operationId: addDay
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramDayRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProgramDayResponse"
  /api/programs/{programId}/days/{dayNumber}/start:
    post:
      tags:
      - Programs
      summary: Start an active workout guided by a program day
      description: Creates a MANUAL ACTIVE workout (same one-active-workout rules
        as POST /api/workouts). Does not fabricate WorkoutSet rows — returns planned
        exercises as guidance only.
      operationId: startDay
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dayNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StartProgramDayResponse"
  /api/notes/import:
    post:
      tags:
      - Notes Import
      summary: Parse raw workout notes into a pending-review workout for human confirmation
      operationId: importNotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportNotesRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutDetailResponse"
  /api/exercises:
    get:
      tags:
      - Exercises
      summary: "List exercises visible to the current user (global + own), with search/filter/sort"
      operationId: listExercises
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - CHEST
          - BACK
          - LEGS
          - ARMS
          - SHOULDERS
          - CORE
          - CARDIO
          - FULL_BODY
          - OTHER
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseExerciseResponse"
    post:
      tags:
      - Exercises
      summary: Create a custom exercise owned by the current user
      operationId: createExercise
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExerciseRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExerciseResponse"
  /api/exercises/{exerciseId}/media-suggestions:
    get:
      tags:
      - Exercise media suggestions
      summary: List media suggestions for an exercise (default status=PENDING)
      operationId: list_2
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: PENDING
          enum:
          - PENDING
          - CONFIRMED
          - REJECTED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseMediaSuggestionResponse"
    post:
      tags:
      - Exercise media suggestions
      summary: "Generate pending media suggestions (curated YouTube, Wikimedia, optional\
        \ YouTube API)"
      operationId: generate
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseMediaSuggestionResponse"
  /api/coach/recommendations/{id}/apply:
    post:
      tags:
      - AI Coach
      summary: Apply a recommendation to uncompleted sets after explicit approval
      operationId: applyToSession
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCoachRecommendationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSetResponse"
  /api/coach/recommendations/generate:
    post:
      tags:
      - AI Coach
      summary: Generate a new proposed recommendation within deterministic bounds
      description: Uses the latest readiness check-in and recent exercise history.
        Numeric bounds are computed in application code; the LLM (if enabled) only
        selects within them.
      operationId: generate_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCoachRequest"
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoachRecommendationResponse"
  /api/coach/chat:
    post:
      tags:
      - AI Coach
      summary: Chat-style check-in that returns a structured CoachRecommendation card
      description: "Parses free text into a readiness check-in, runs the bounds-checked\
        \ pipeline, and returns a recommendation (not a freeform chat reply). Injury/pain\
        \ keywords return a fixed safety response without calling the LLM."
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoachRecommendationResponse"
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new account and receive an access token
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
      security: []
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password and receive an access token
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
      security: []
  /api/workouts/{workoutId}/reject-import:
    patch:
      tags:
      - Workouts
      summary: Reject an AI-imported pending-review workout
      operationId: rejectImport
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutDetailResponse"
  /api/workouts/{workoutId}/confirm-import:
    patch:
      tags:
      - Workouts
      summary: Confirm an AI-imported pending-review workout so it counts toward statistics
      operationId: confirmImport
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutDetailResponse"
  /api/workouts/{workoutId}/complete:
    patch:
      tags:
      - Workouts
      summary: Complete an active workout
      operationId: completeWorkout
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutDetailResponse"
  /api/sets/{setId}/complete:
    patch:
      tags:
      - Workout Sets
      summary: Mark a set complete and evaluate PRs
      operationId: completeSet
      parameters:
      - name: setId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutSetResponse"
  /api/exercises/{exerciseId}/media-suggestions/{suggestionId}/reject:
    patch:
      tags:
      - Exercise media suggestions
      summary: Reject a pending media suggestion
      operationId: reject
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suggestionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExerciseMediaSuggestionResponse"
  /api/exercises/{exerciseId}/media-suggestions/{suggestionId}/confirm:
    patch:
      tags:
      - Exercise media suggestions
      summary: Confirm a pending suggestion and publish its media onto the exercise
      operationId: confirm
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suggestionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExerciseMediaSuggestionResponse"
  /api/coach/recommendations/{id}/modify:
    patch:
      tags:
      - AI Coach
      summary: "Modify the proposed change on a PROPOSED recommendation, then mark\
        \ MODIFIED"
      operationId: modify
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyCoachRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoachRecommendationResponse"
  /api/coach/recommendations/{id}/dismiss:
    patch:
      tags:
      - AI Coach
      summary: Dismiss a PROPOSED recommendation
      operationId: dismiss
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoachRecommendationResponse"
  /api/coach/recommendations/{id}/accept:
    patch:
      tags:
      - AI Coach
      summary: Accept a PROPOSED recommendation (does not mutate workout data)
      operationId: accept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoachRecommendationResponse"
  /api/workouts/{workoutId}:
    get:
      tags:
      - Workouts
      summary: Get a workout with its sets and exercise info
      operationId: getWorkout
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkoutDetailResponse"
    delete:
      tags:
      - Workouts
      summary: Cancel a workout (soft delete; completed workouts cannot be cancelled)
      operationId: cancelWorkout
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/workouts/{workoutId}/exercise-notes:
    get:
      tags:
      - Workout Sets
      summary: List exercise-level notes for a workout
      operationId: listExerciseNotes
      parameters:
      - name: workoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutExerciseNoteResponse"
  /api/stats/weekly:
    get:
      tags:
      - Statistics
      summary: Weekly training statistics (Monday-Sunday) for the week containing
        the given date
      description: "Counts only confirmed, completed workouts. Defaults to the current\
        \ week (UTC) when `date` is omitted."
      operationId: weeklyStats
      parameters:
      - name: date
        in: query
        description: Any date within the desired week; defaults to today (UTC)
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WeeklyStatsResponse"
  /api/stats/volume-trend:
    get:
      tags:
      - Statistics
      summary: "Weekly total volume trend for the last N weeks (default 12, max 52)"
      operationId: volumeTrend
      parameters:
      - name: weeks
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 12
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VolumeTrendResponse"
  /api/readiness/latest:
    get:
      tags:
      - Readiness
      summary: Get the most recent readiness check-in
      operationId: latest
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/exercises/{exerciseId}/pr:
    get:
      tags:
      - Statistics
      summary: "Personal records for an exercise, from confirmed completed workouts\
        \ only"
      operationId: personalRecord
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PersonalRecordResponse"
  /api/exercises/{exerciseId}/pr-history:
    get:
      tags:
      - Statistics
      summary: Estimated 1RM time series for an exercise (one point per completed
        session)
      operationId: prHistory
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PrHistoryResponse"
  /api/exercises/{exerciseId}/next-session-recommendation:
    get:
      tags:
      - Statistics
      summary: Deterministic progressive-overload recommendation based on the most
        recent session
      operationId: nextSessionRecommendation
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NextSessionRecommendationResponse"
  /api/exercises/{exerciseId}/detail:
    get:
      tags:
      - Exercises
      summary: "Exercise detail: metadata, recent sets, current PR, 1RM trend, and\
        \ active coach card"
      operationId: getExerciseDetail
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExerciseDetailResponse"
  /api/coach/recommendations:
    get:
      tags:
      - AI Coach
      summary: "List coach recommendations, optionally filtered by status"
      operationId: list_3
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PROPOSED
          - ACCEPTED
          - MODIFIED
          - DISMISSED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachRecommendationResponse"
  /api/coach/recommendations/{id}/apply-preview:
    get:
