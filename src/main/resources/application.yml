spring:
  application:
    name: gymsync-api
  mvc:
    # Required so GlobalExceptionHandler can return a consistent ErrorResponse for unknown paths.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # Avoid treating unknown API paths as static-resource lookups when no-handler-found is enabled.
      add-mappings: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymsync}
    username: ${DB_USER:gymsync}
    password: ${DB_PASSWORD:gymsync}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.gymsync.api: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

gymsync:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-of-entropy}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  webhook:
    secret: ${WEBHOOK_SECRET:change-me-webhook-secret}
    timestamp-tolerance-seconds: 300
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  llm:
    provider: ${LLM_PROVIDER:rule-based}
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${LLM_MODEL:gpt-4o-mini}
    timeout-ms: 15000
    max-retries: 1
    max-raw-text-length: 10000
    max-exercises: 20
    max-sets-per-exercise: 20
  training:
    target-rep-min: ${TRAINING_TARGET_REP_MIN:8}
    target-rep-max: ${TRAINING_TARGET_REP_MAX:12}
    weight-increment: ${TRAINING_WEIGHT_INCREMENT:5.00}
  media:
    # Optional YouTube Data API v3 key for live demo search. Blank = curated + Wikimedia only.
    youtube-api-key: ${YOUTUBE_API_KEY:}
